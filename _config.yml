# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely edit after that. If you find
# yourself editing this file very often, consider using Jekyll's data files
# feature for the data you need to update frequently.
#
# For technical reasons, this file is *NOT* reloaded automatically when you use
# 'bundle exec jekyll serve'. If you change this file, please restart the server process.
#
# If you need help with YAML syntax, here are some quick references for you:
# https://learn-the-web.algonquindesign.ca/topics/markdown-yaml-cheat-sheet/#yaml
# https://learnxinyminutes.com/docs/yaml/
#
# Site settings
# These are used to personalize your new site. If you look in the HTML files,
# you will see them accessed via {{ site.title }}, {{ site.email }}, and so on.
# You can create any custom variable you would like, and they will be accessible
# in the templates via {{ site.myvariable }}.

title: ElArk's Blog
description: >- # this means to ignore newlines until "baseurl:"
    Biological data scientist turned ML engineer. Writing about machine learning,
    software engineering, and sometimes about other matters.
baseurl: "/blog" # the subpath of your site, e.g. /blog
url: "https://elarkk.github.io" # the base hostname & protocol for your site, e.g. http://example.com
author: Arkadij Kummer
twitter_username: ArkadijBollwerk
github_username: ElArkk

# Google Analytics 4 measurement ID. Only loaded when JEKYLL_ENV=production
# (see _includes/head.html). Respects DoNotTrack browser settings.
google_analytics: G-0CRDYP7FRY

# SEO defaults
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
      author: "Arkadij Kummer"
      image_width: 1536
      image_height: 1024
      image_alt: "ElArk's Blog post header"
  - scope:
      path: ""
    values:
      image: /assets/img/og/og-default.webp
  - scope:
      path: "days"
    values:
      sitemap: false
      image_width: 950
      image_height: 630
      image_alt: "ElArk's Blog"

# Staticman & reCAPTCHA
# Set this to your Modal web endpoint base URL (no trailing slash)
staticman_endpoint: "https://elarkk--staticman-elarkk-fastapi-app.modal.run"
recaptcha:
  enabled: true
  # Public site key - get from https://www.google.com/recaptcha/admin (v2 "I'm not a robot" checkbox)
  site_key: "6Le2EFEsAAAAAGIkHK4dzBaIWGJCBfX6BrW6E_-j"
  # Encrypted secret - encrypt at: https://elarkk--staticman-elarkk-fastapi-app.modal.run/v2/encrypt/YOUR_RECAPTCHA_SECRET
  encrypted_secret: ""

# Build settings
theme: minima
plugins:
    - jekyll-feed
    - jekyll-responsive-image
    - jekyll-seo-tag
    - jekyll-sitemap
    - jekyll-paginate

highlighter: rouge
markdown: kramdown
sass:
  quiet_deps: true
kramdown:
  input: GFM
  syntax_highlighter: rouge

# Include pages directory
include:
  - _pages

# Permalink structure
permalink: /:year/:month/:day/:title/

# Pagination
paginate: 10
paginate_path: "/page:num/"
# Exclude from processing.
# The following items will not be processed, by default.
# Any item listed under the `exclude:` key here will be automatically added to
# the internal "default list".
#
# Excluded items can be processed by explicitly listing the directories or
# their entries' file path in the `include:` list.
#
# Exclude from processing
exclude:
  - .sass-cache/
  - .jekyll-cache/
  - gemfiles/
  - Gemfile
  - Gemfile.lock
  - node_modules/
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
  - package.json
  - package-lock.json
  - .gitignore
  - .gitattributes
  - README.md
  - docs/
  - test/
  - CLAUDE.md
  - .pixi/
